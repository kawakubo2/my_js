<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC会社 | 新着情報 | 〇〇商品リニューアル</title>
</head>
<body>
  <h1>はじめてのHTML</h1>
  <section>
    <h2>段落</h2>
    <p>見出しタグは文字の大きさを調整するものではなく、<br>記述する内容のレベルを合わせるために使用するものです。</p>
    <p>文字の大きさの調整はCSSで行うようにします。</p>
  </section>
  <section>
    <h2>箇条書き</h2>
    <p>箇条書きには3種類のタグがあります。</p>
    <ul>
      <li>ulタグ・・・番号が付かない箇条書き(表示順が重要でないときに使用)</li>
      <li>olタグ・・・番号が付く箇条書き(表示する順序に意味があるときに使用)</li>
      <li>dlタグ・・・見出し(dtタグ)と本文(ddタグ)のように辞書的に並べるときに使用</li>
    </ul>

  </section>

  
</body>
</html>
