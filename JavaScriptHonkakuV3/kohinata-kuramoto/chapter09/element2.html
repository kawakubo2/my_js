<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="element2.css">
  <title>Document</title>
</head>
<body>
  <h2>querySelectorで要素を見つける練習</h2>
  <div>
    <h3>言語の選択</h3>
    <select name="language" id="language">
      <option value="">選択</option>
      <option value="java">Java</option>
      <option value="python">Python</option>
      <option value="csharp">C#</option>
    </select>
  </div>
  <div class="course" id="primer">
    <ul>
      <li class="java">Java初級コース(15万)</li>
      <li class="python">Python初級コース(12万)</li>
      <li class="csharp">C#初級コース</li>
    </ul>
  </div>
  <div class="course" id="professional">
    <ul>
      <li class="java">Java中級コース(15万)</li>
      <li class="python">Python中級コース(12万)</li>
      <li class="csharp">C#中級コース</li>
    </ul>
  </div>
  <div class="pricing">
    <ul>
      <li class="java">45万</li>
      <li class="python">30万</li>
      <li class="csharp">45万</li>
    </ul>
  </div>
  <script src="element2.js"></script>
</body>
</html>
